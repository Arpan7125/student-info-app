<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Information System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Student Information System</h1>

    <div class="student-card">
      <p><span class="label">Name:</span> <span class="value">Cynthia</span></p>
      <p><span class="label">Register Number:</span> <span class="value">101</span></p>
      <p><span class="label">Programme:</span> <span class="value">MCA</span></p>
    </div>

    <button id="showDetailsBtn">Show Details</button>

    <div class="student-card details" id="studentDetails" hidden>
      <p><span class="label">Semester:</span> <span class="value">5</span></p>
      <p><span class="label">Section:</span> <span class="value">A</span></p>
      <p><span class="label">Mentor:</span> <span class="value">Dr. R. Menon</span></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
